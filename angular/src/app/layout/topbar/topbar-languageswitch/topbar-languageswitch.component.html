<div class="topbar-language">
  <a class="topbar-language__link" title="Release Note" target="_blank"
    href="https://docs.google.com/document/d/13kP2JNm9BhWx0-BW7Hb0RJmukF4r6G9JjZb6tIpcEUU/edit">
    <i class="material-icons">description</i>
  </a>

  <a class="topbar-language__link" title="User guide" target="_blank"
    href="https://docs.google.com/document/d/1-h4z6oW1ouqXPP05SkVJss3JzkyEA-8Y/edit">
    <i class="material-icons">help_outline</i>
  </a>

  <div class="topbar-language__divider"></div>

  <div class="topbar-language__dropdown">
    <button class="topbar-language__trigger" data-toggle="dropdown" role="button">
      <i class="{{currentLanguage.icon}}"></i>
      <span>{{currentLanguage.displayName}}</span>
      <i class="material-icons topbar-language__arrow">expand_more</i>
    </button>
    <ul class="dropdown-menu topbar-language__menu">
      <li *ngFor="let language of languages">
        <a *ngIf="language.name != currentLanguage.name" class="topbar-language__menu-item"
          (click)="changeLanguage(language.name)">
          <i class="{{language.icon}}"></i>
          <span>{{language.displayName}}</span>
        </a>
      </li>
    </ul>
  </div>
</div>
