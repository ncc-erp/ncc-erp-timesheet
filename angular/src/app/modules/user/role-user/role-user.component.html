<form autocomplete="off" #createUserModal="ngForm" [busy]="isSaving" class="user-modal">
  <div
    class="user-modal__header"
    cdkDrag
    cdkDragRootElement=".cdk-overlay-pane"
    cdkDragHandle
    mat-dialog-title
  >
    <div>
      <div class="user-modal__title">
        {{ l(title) }}
      </div>
      <div class="user-modal__subtitle">
        Assign roles and permissions to this user.
      </div>
    </div>
  </div>

  <mat-dialog-content class="user-modal__body" style="max-height: 50vh;">
    <div class="user-modal__section">
      <div class="user-modal__section-title">Available roles</div>
      
      <div class="user-modal__roles-grid">
        <ng-template ngFor let-role [ngForOf]="roles">
          <div class="user-modal__role-item">
            <mat-checkbox
              [name]="'checkRole-' + role.id"
              [checked]="isRoleChecked(role.normalizedName)"
              (change)="onRoleChange(role, $event)"
            >
              {{ role.name }}
            </mat-checkbox>
          </div>
        </ng-template>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions
    align="end"
    class="user-modal__footer"
  >
    <button
      class="user-modal__btn user-modal__btn--ghost"
      mat-raised-button
      mat-dialog-close
      name="cancelBtn"
      [disabled]="saving"
    >
      {{ l('Cancel') }}
    </button>
    <button
      mat-raised-button
      color="primary"
      name="saveBtn"
      class="user-modal__btn user-modal__btn--primary"
      (keyup.enter)="save()"
      (click)="save()"
    >
      {{ l('Save') }}
    </button>
  </mat-dialog-actions>
</form>
