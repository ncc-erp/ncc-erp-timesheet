<form autocomplete="off" #addUserForm="ngForm" (ngSubmit)="save()" class="custom-dialog-form">
    <div class="dialog-header">
        <h1 class="dialog-title" mat-dialog-title>
            {{ 'Add New User to Whitelist' | localize }}
        </h1>
        <mat-icon (click)="close()" class="close-icon">close</mat-icon>
    </div>
    <hr />
    <mat-dialog-content>
        <div class="row">
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100 form-field-spacing">
                    <mat-label>{{ "User" | localize }}</mat-label>
                    <mat-select name="userId" [(ngModel)]="userId" required placeholder="Select user...">
                        <mat-option>
                            <ngx-mat-select-search [formControl]="userSearch" 
                                placeholderLabel="Search by Email/Name"
                                noEntriesFoundLabel="No matching found">
                            </ngx-mat-select-search>
                        </mat-option>
                        <mat-option *ngFor="let item of listUserFiltered" [value]="item.id">
                            {{ item.userName }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100 form-field-spacing">
                    <mat-label>{{ "Whitelist Type" | localize }}</mat-label>
                    <mat-select name="whitelistName" [(ngModel)]="selectedWhitelistTypeId" required>
                        <mat-option *ngFor="let item of whitelistTypesList" [value]="item.value">
                            {{ item.name | localize }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button class="btn btn-default" type="button" mat-raised-button (click)="close()" [disabled]="saving">
            {{ "Cancel" | localize }}
        </button>
        
        <button mat-raised-button color="primary" type="submit" [disabled]="!addUserForm.form.valid || saving" class="m-l-10">
            {{ "Save" | localize }}
        </button>
    </mat-dialog-actions>
</form>
