<div class="success-dialog-container">
  <div class="header">
    <mat-icon class="success-icon">check_circle</mat-icon>
    <h2 mat-dialog-title>Payment Recorded</h2>
  </div>

  <div mat-dialog-content>
    <p class="subtitle">
      Your payment information has been submitted successfully.
    </p>

    <div class="details-wrapper">
      <div class="detail-row">
        <span>Transaction hash</span>
        <a
          class="monospace"
          [href]="transactionExplorerUrl + data.transactionHash"
          target="_blank"
          rel="noopener noreferrer"
          matTooltip="View transaction on explorer"
        >
          {{ data.transactionHash || 'N/A' }}
        </a>
      </div>

      <div class="detail-row">
        <span>Amount Paid</span>
        <span>
          {{ data.amountPaid ? (data.amountPaid | number:'1.0-4') : 'N/A' }} đồng
        </span>
      </div>
    </div>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-flat-button color="primary" (click)="close()">Close</button>
  </div>
</div>
