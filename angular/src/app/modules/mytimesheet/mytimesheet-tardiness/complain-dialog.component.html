<h2 mat-dialog-title>Complain</h2>
<mat-dialog-content>
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <p class="date-info"><strong>Date:</strong> {{timekeeping.date | date:'dd/MM/yyyy'}}</p>
   
        <div *ngIf="punishmentTypes.length === 0" class="no-punishment-message" style="color: #d32f2f; text-align: center; margin: 24px 0; padding: 16px; background-color: #ffebee; border-radius: 8px;">
          <mat-icon color="warn" style="vertical-align: middle; margin-right: 8px;">info</mat-icon>
          There are no penalties on this day.
        </div>
        
  
    <div *ngIf="punishmentTypes.length > 0" class="punishment-list">
          <div *ngFor="let type of punishmentTypes" class="punishment-item" style="margin-bottom: 16px; padding: 12px; border-radius: 8px; border: 1px solid #eee;">
            <div class="punishment-header" style="display: flex; align-items: center;">
              <mat-checkbox [checked]="userNotes[type.value] !== undefined && userNotes[type.value] !== ''" 
                            (change)="onCheckboxChange($event, type.value)">
                {{type.name}}
              </mat-checkbox>
              <span *ngIf="type.description" style="margin-left: 8px; color: #888;">({{type.description}})</span>
            </div>
            <div *ngIf="userNotes[type.value] !== undefined && userNotes[type.value] !== null" class="punishment-note" style="margin-top: 8px;">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Lý do khiếu nại</mat-label>
                <textarea matInput [(ngModel)]="userNotes[type.value]" 
                          placeholder="Nhập lý do khiếu nại..." maxlength="500"></textarea>
                <mat-hint align="end">{{userNotes[type.value]?.length || 0}} / 500</mat-hint>
              </mat-form-field>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onNoClick()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" 
          [disabled]="!hasValidComplaint()">Submit</button>
</mat-dialog-actions>
