<h1 mat-dialog-title>Submit Fine Payment</h1>

<div mat-dialog-content class="transaction-dialog-content">

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Recipient Address</mat-label>
    <input matInput [formControl]="recipientAddressControl" required readonly />
    <mat-error *ngIf="recipientAddressControl.hasError('required')">
      Recipient address is required.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Amount</mat-label>
    <input
      matInput
      type="text"
      (input)="onAmountInput($event)"
      [formControl]="amountControl"
      placeholder="E.g. 1,000" 
      required
    />

    <mat-error *ngIf="amountControl.hasError('required')">
      Amount is required.
    </mat-error>
    <mat-error *ngIf="amountControl.hasError('pattern')">
      Please enter a valid number.
    </mat-error>
    <mat-error *ngIf="amountControl.hasError('minAmount')">
      Amount must be at least {{ minAmount | number }}.
    </mat-error>
    <mat-error *ngIf="amountControl.hasError('max')">
      Insufficient balance.
    </mat-error>
  </mat-form-field>

  <div class="balance-info">
    <span class="balance-label">Available Balance:</span>
    <span class="balance-value">{{ userBalanceDisplay }} đồng</span>
  </div>

  <div *ngIf="errorMessage" class="error-alert">
    {{ errorMessage }}
  </div>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="onCancel()" [disabled]="isSubmitting">
    Cancel
  </button>
  <button
    mat-raised-button
    color="primary"
    type="button"
    (click)="onSubmit()"
    [disabled]="isSubmitting"
  >
    <span *ngIf="!isSubmitting">Submit</span>
    <span *ngIf="isSubmitting">Submitting...</span>
  </button>
</div>
