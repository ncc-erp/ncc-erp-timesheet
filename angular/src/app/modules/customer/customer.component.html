<div class="row clearfix customer-wrapper" [@routerTransition]>
  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
    <div class="card main-content">
      <div class="header">
        <div class="header__title-group">
          <h2>{{ "Manage Clients" | localize }}</h2>
          <span class="text-muted">The list of clients is used to assign timesheets, projects, and requests.</span>
        </div>
        <div class="header-right-actions">
          <div class="search-wrapper">
            <input type="text" class="custom-search-input" [(ngModel)]="searchText" name="searchText"
              placeholder="Search by name or address" (keyup.enter)="searchOrFilter()">
          </div>
          <button *ngIf="permission.isGranted(ADD_CLIENT)" mat-raised-button color="primary" (click)="createCustomer()">
            <mat-icon style="margin-right: 4px;">add</mat-icon>New Client
          </button>
          <button mat-icon-button color="primary" name="refreshBtn" matTooltip="Refresh" (click)="refresh()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </div>
      <div class="body table-responsive">
        <div class="customer-table-wrapper">
          <table class="table table-hover table-striped" [busy]="isTableLoading">
            <thead class="bg-light">
              <tr>
                <th>Name</th>
                <th>Code</th>
                <th>Address</th>
                <th *ngIf="permission.isGranted(DELETE_CLIENT) || permission.isGranted(EDIT_CLIENT)" style="width: 150px; text-align: right; padding-right: 20px;">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr
                *ngFor="let customer of customers | paginate: { id: 'server', itemsPerPage: pageSize, currentPage: pageNumber, totalItems: totalItems } ">
                <td>{{ customer.name }}</td>
                <td>{{ customer.code }}</td>
                <td>{{ customer.address }}</td>
                <td style="text-align: right; white-space: nowrap; padding-right: 20px;">
                  <button *ngIf="permission.isGranted(DELETE_CLIENT)" mat-raised-button color="warn"
                    (click)="delete(customer)" style="margin-right: 8px;">
                    Delete
                  </button>
                  <button *ngIf="permission.isGranted(EDIT_CLIENT)" mat-raised-button color="primary"
                    (click)="editCustomer(customer)">
                    Edit
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="abp-pagination-controls-wrapper">
          <abp-pagination-controls [totalNumber]="totalItems" (selectionChange)="getPageSize($event)"
            (pageChange)="getDataPage($event)" id="server">
          </abp-pagination-controls>
        </div>
      </div>
    </div>
  </div>
</div>
