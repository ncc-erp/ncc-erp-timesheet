<div class="row">
  <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
    <div class="card main-content">
      <div class="header">
        <h2>{{ "Anomalies Timelog Report" | localize }}</h2>
        <ul class="header-dropdown m-r--5">
          <li>
            <button mat-icon-button [matMenuTriggerFor]="headerMenu" class="header-dropdown-mat-icon-button">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #headerMenu="matMenu">
              <button mat-menu-item name="refreshBtn" (click)="refresh()">
                <mat-icon>refresh</mat-icon>
                <span>{{ "Refresh" | localize }}</span>
              </button>
            </mat-menu>
          </li>
        </ul>
      </div>

      <div class="body">
        <mat-tab-group [(selectedIndex)]="selectedTabIndex" (selectedTabChange)="onTabChange($event)">
          <mat-tab label="{{ 'Yesterday' | localize }}">
            <app-anomalies-tab
              [dataType]="DataType.YESTERDAY"
              [searchText]="searchTextYesterday"
              [selectedBranchIds]="selectedBranchIdsYesterday"
              [filteredAbsences]="filteredYesterdayAbsences"
              [filteredShortHours]="filteredYesterdayShortHours"
              [isLoading]="isLoading"
              [filteredBranches]="filteredBranches"
              [isActive]="selectedTabIndex === 0"
              [selectedTabIndex]="selectedTabIndex"
              [listBranch]="listBranch"
              [getSortIconFn]="getSortIcon.bind(this)"
              (searchChangeEmit)="onSearchChange($event)"
              (clearSearchEmit)="clearSearch()"
              (filterBranchEmit)="filterBranch($event)"
              (branchChange)="onBranchSelectionChange($event)"
              (sortEmit)="sort($event.column, $event.dataType, $event.tableType)"
              (selectAllToggle)="toggleSelectAll($event)">
            </app-anomalies-tab>
          </mat-tab>

          <mat-tab label="{{ 'Last Week' | localize }}">
            <app-anomalies-tab
              [dataType]="DataType.LAST_WEEK"
              [searchText]="searchTextLastWeek"
              [selectedBranchIds]="selectedBranchIdsLastWeek"
              [filteredAbsences]="filteredLastWeekAbsences"
              [filteredShortHours]="filteredLastWeekShortHours"
              [isLoading]="isLoading"
              [filteredBranches]="filteredBranches"
              [isActive]="selectedTabIndex === 1"
              [selectedTabIndex]="selectedTabIndex"
              [listBranch]="listBranch"
              [getSortIconFn]="getSortIcon.bind(this)"
              (searchChangeEmit)="onSearchChange($event)"
              (clearSearchEmit)="clearSearch()"
              (filterBranchEmit)="filterBranch($event)"
              (branchChange)="onBranchSelectionChange($event)"
              (sortEmit)="sort($event.column, $event.dataType, $event.tableType)"
              (selectAllToggle)="toggleSelectAll($event)">
            </app-anomalies-tab>
          </mat-tab>
        </mat-tab-group>
      </div>
    </div>
  </div>
</div>
