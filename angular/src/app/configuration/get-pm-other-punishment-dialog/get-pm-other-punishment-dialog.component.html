<form style="position: relative">
    <h1 style="cursor: default;" mat-dialog-title>
        <div class="align-items-center d-flex">Get Data Manually
        </div>
    </h1>
    <mat-icon (click)="close()" class="close-icon">close</mat-icon>
    <hr />
    <mat-dialog-content>
        <div class="row">
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Month</mat-label>
                    <mat-select [(ngModel)]="getPMOtherPunishmentAtMonth" name="getPMOtherPunishmentAtMonth" required>
                        <mat-option *ngFor="let m of months" [value]="m">{{m}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-md-6">
                <mat-form-field appearance="outline" class="w-100">
                    <mat-label>Year</mat-label>
                    <mat-select [(ngModel)]="getPMOtherPunishmentAtYear" name="getPMOtherPunishmentAtYear" required>
                        <mat-option *ngFor="let y of years" [value]="y">{{y}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button class="btn btn-default" mat-raised-button mat-dialog-close [disabled]="saving">Cancel</button>
        <button mat-raised-button color="primary" 
                (click)="onManualTriggerPMOtherPunishment()"
                [disabled]="!getPMOtherPunishmentAtMonth || !getPMOtherPunishmentAtYear">
            Get Data
        </button>
    </mat-dialog-actions>
</form>
